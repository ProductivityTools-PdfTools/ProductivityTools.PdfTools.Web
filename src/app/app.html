@if (authService.user()) {
<div class="session-bar">
  <span class="session-info">
    <span class="session-dot"></span>
    Session: <strong>{{ authService.user()?.email }}</strong>
  </span>
  <span class="session-actions">
    <span class="user-name">{{ authService.user()?.displayName }}</span>
    <a href="javascript:void(0)" (click)="logout()">Logout</a>
  </span>
</div>
}

<header class="top-bar">
  <a class="brand" routerLink="/">PDF Tools</a>

  @if (authService.user()) {
  <nav>
    <ul class="menu">
      <li class="menu-item">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      </li>
      <li class="menu-item">
        <a routerLink="/merge-odd-and-even-files" routerLinkActive="active">Merge Odd and Even Files</a>
      </li>
      <li class="menu-item">
        <a routerLink="/reverse-pages-in-file" routerLinkActive="active">Reverse Pages in File</a>
      </li>
      <li class="menu-item">
        <a routerLink="/split-into-pages" routerLinkActive="active">Split Into Pages</a>
      </li>
      <li class="menu-item">
        <a routerLink="/images-to-pdf" routerLinkActive="active">Images to PDF</a>
      </li>
    </ul>
  </nav>
  }
</header>

<main class="content">
  <router-outlet />
</main>

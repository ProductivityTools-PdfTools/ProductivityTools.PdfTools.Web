<div class="tool-card">
    <div class="tool-header">
        <h2>Merge PDF Files</h2>
        <p>Combine two PDFs (odd and even pages) into a single document.</p>
    </div>

    <div class="form-group">
        <label for="file1">Odd Pages File (1, 3, 5...)</label>
        <input id="file1" type="file" (click)="pickFile1($event)" (change)="onFile1Selected($event)" accept=".pdf,application/pdf" />
        @if (file1(); as f) {
        <p class="selected-file">Selected: <strong>{{ f.name }}</strong></p>
        }
    </div>

    <div class="form-group">
        <label for="file2">Even Pages File (2, 4, 6...)</label>
        <input id="file2" type="file" (click)="pickFile2($event)" (change)="onFile2Selected($event)" accept=".pdf,application/pdf" />
        @if (file2(); as f) {
        <p class="selected-file">Selected: <strong>{{ f.name }}</strong></p>
        }
    </div>

    <button class="primary-button" (click)="mergeFiles()">Merge Files</button>
</div>

<div class="tool-card">
    <div class="tool-header">
        <h2>Reverse PDF Pages</h2>
        <p>Invert the order of pages in your PDF document.</p>
    </div>

    <div class="form-group">
        <label for="pdfFile">Select PDF File</label>
        <input id="pdfFile" type="file" (click)="pickFile($event)" (change)="onFileSelected($event)" accept=".pdf,application/pdf" />
        @if (file(); as f) {
        <p class="selected-file">Selected: <strong>{{ f.name }}</strong></p>
        }
    </div>

    <button class="primary-button" (click)="reversePagesInFile()">Reverse Pages</button>
</div>
